const D=[["NEET 2019", "Select the correctly written scientific name of Mango first described by Linnaeus:", ["Mangifera indica Car. Linn.", "Mangifera indica Linn.", "Mangifera indica", "Mangifera Indica"], 1, "Genus is capitalised, species lowercase, and the author name (Linn. for Linnaeus) follows in roman."], ["NEET 2016", "Housefly: match A Family, B Order, C Class, D Phylum with i Diptera, ii Arthropoda, iii Muscidae, iv Insecta.", ["A-iii, B-i, C-iv, D-ii", "A-iii, B-ii, C-iv, D-i", "A-iv, B-iii, C-ii, D-i", "A-iv, B-ii, C-i, D-iii"], 0, "Family Muscidae, Order Diptera, Class Insecta, Phylum Arthropoda."], ["NEET 2022", "Which hierarchical arrangement is correct for animals?", ["Kingdom, Phylum, Class, Order, Family, Genus, Species", "Kingdom, Class, Phylum, Family, Order, Genus, Species", "Kingdom, Order, Class, Phylum, Family, Genus, Species", "Kingdom, Order, Phylum, Class, Family, Genus, Species"], 0, "Ranks go broadest to narrowest. Plants use Division in place of Phylum."], ["NEET 2016", "Which one of the following statements is wrong?", ["Cyanobacteria are also called blue-green algae", "Golden algae are also called desmids", "Eubacteria are also called false bacteria", "Phycomycetes are also called algal fungi"], 2, "Eubacteria are the \"true bacteria\", not false bacteria."], ["NEET 2016/2018", "Select the wrong statement.", ["Bacteria cell wall is made up of peptidoglycan", "Pili and fimbriae are mainly involved in motility of bacterial cells", "Cyanobacteria lack flagellated cells", "Mycoplasma is a wall-less microorganism"], 1, "Pili and fimbriae help attachment, not motility. Flagella give motility."], ["NEET 2016", "Methanogens belong to", ["Eubacteria", "Archaebacteria", "Dinoflagellates", "Slime moulds"], 1, "Methanogens are archaebacteria living in oxygen-free habitats such as ruminant guts."], ["NEET 2016", "Primitive prokaryotes responsible for biogas from dung of ruminants include the:", ["Halophiles", "Thermoacidophiles", "Methanogens", "Eubacteria"], 2, "Methanogens make methane (biogas) from dung and cellulose-rich food."], ["NEET 2016", "Which statement about methanogens is not correct?", ["They can be used to produce biogas.", "They are found in the rumen of cattle and their excreta.", "They grow aerobically and breakdown cellulose-rich food.", "They produce methane gas."], 2, "Methanogens grow anaerobically, not aerobically."], ["NEET 2016", "Chrysophytes, Euglenoids, Dinoflagellates and Slime moulds are included in the kingdom:", ["Monera", "Protista", "Fungi", "Animalia"], 1, "These are all unicellular or simple eukaryotes placed in Protista."], ["NEET 2016/2018", "Select the wrong statement.", ["The walls of diatoms are easily destructible", "Diatomaceous earth is formed by the cell walls of diatoms", "Diatoms are chief producers in the oceans", "Diatoms are microscopic and float passively in water"], 0, "Diatom walls are indestructible (silica), which is why diatomaceous earth forms."], ["NEET 2016", "Which one is wrong for fungi?", ["They are eukaryotic", "All fungi possess a purely cellulosic cell wall", "They are heterotrophic", "They are both unicellular and multicellular"], 1, "Fungal walls are made of chitin and polysaccharides, not purely cellulose."], ["NEET 2016", "One of the major components of the cell wall of most fungi is:", ["Chitin", "Peptidoglycan", "Cellulose", "Hemicellulose"], 0, "Chitin is the key fungal wall component. Peptidoglycan is bacterial."], ["NEET 2016", "Which statement is wrong for viroids?", ["They lack a protein coat", "They are smaller than viruses", "They cause infections", "Their RNA is of high molecular weight"], 3, "Viroid RNA has low molecular weight."], ["NEET 2017", "Which are found in extreme saline conditions?", ["Archaebacteria", "Eubacteria", "Cyanobacteria", "Mycobacteria"], 0, "Halophiles, a type of archaebacteria, live in extremely salty areas."], ["NEET 2017", "Smallest living cells, without a definite cell wall, pathogenic to plants and animals, survive without oxygen:", ["Bacillus", "Pseudomonas", "Mycoplasma", "Nostoc"], 2, "Mycoplasma lack a cell wall and can live without oxygen."], ["NEET 2017", "Which of the following statements is correct?", ["Lichens do not grow in polluted areas.", "Algal component of lichens is called mycobiont.", "Fungal component of lichens is called phycobiont.", "Lichens are not good pollution indicators."], 0, "Lichens are sensitive to pollution (e.g. SO2). Algae are phycobiont and fungi are mycobiont."], ["NEET 2017", "Viroids differ from viruses in having:", ["DNA molecules with protein coat", "DNA molecules without protein coat", "RNA molecules with protein coat", "RNA molecules without protein coat"], 3, "Viroids are free RNA with no protein coat."], ["NEET 2018", "Which of the following is not a prokaryote?", ["Bacteria", "Blue green algae", "Mycoplasma", "Fungi"], 3, "Fungi are eukaryotes."], ["NEET 2018", "Which among the following is not a prokaryote?", ["Nostoc", "Mycobacterium", "Saccharomyces", "Oscillatoria"], 2, "Saccharomyces is yeast, a eukaryotic fungus."], ["NEET 2018", "Chief producers in the oceans are:", ["Cyanobacteria", "Diatoms", "Dinoflagellates", "Euglenoids"], 1, "Diatoms are the chief marine producers."], ["NEET 2018", "After karyogamy followed by meiosis, spores are produced exogenously in", ["Agaricus", "Alternaria", "Neurospora", "Saccharomyces"], 0, "Agaricus is a basidiomycete: basidiospores form outside (exogenously) on the basidium."], ["NEET 2018", "Match: a Saprophyte, b Parasite, c Lichens, d Mycorrhiza with i Fungi with plant roots, ii Decomposition of dead matter, iii Living on living plants or animals, iv Algae and fungi association.", ["a-i, b-ii, c-iii, d-iv", "a-iii, b-ii, c-i, d-iv", "a-ii, b-i, c-iii, d-iv", "a-ii, b-iii, c-iv, d-i"], 3, "Saprophytes decompose dead matter, parasites live on hosts, lichens are algae+fungi, mycorrhiza is fungi+roots."], ["NEET 2019 Odisha/2022", "Which is a correct statement?", ["Cyanobacteria are autotrophic organisms classified under Kingdom Monera.", "Bacteria are exclusively heterotrophic organisms.", "Slime moulds are saprophytic organisms classified under Kingdom Monera.", "Mycoplasma have DNA, ribosome and cell wall."], 0, "Cyanobacteria are photosynthetic prokaryotes in Monera. Slime moulds are Protista and mycoplasma lack a wall."], ["NEET 2019 Odisha", "Match habitats: a Halophiles, b Thermoacidophiles, c Methanogens, d Cyanobacteria with i Hot springs, ii Aquatic environment, iii Guts of ruminants, iv Salty area.", ["a-iv, b-i, c-iii, d-ii", "a-i, b-ii, c-iii, d-iv", "a-iii, b-iv, c-ii, d-i", "a-ii, b-iv, c-iii, d-i"], 0, "Halophiles: salty areas. Thermoacidophiles: hot springs. Methanogens: ruminant guts. Cyanobacteria: aquatic."], ["NEET 2019/2021", "Which statement is incorrect?", ["Morels and truffles are edible delicacies.", "Claviceps is a source of many alkaloids and LSD.", "Conidia are produced exogenously and ascospores endogenously.", "Yeasts have filamentous bodies with long thread-like hyphae."], 3, "Yeasts are unicellular. They do not form long hyphae."], ["NEET 2019/2021", "Which statement is incorrect?", ["Viroids lack a protein coat.", "Viruses are obligate parasites.", "Infective constituent in viruses is the protein coat.", "Prions consist of abnormally folded proteins."], 2, "The infective part of a virus is its nucleic acid, not the protein coat."], ["NEET 2019 Odisha", "Mad cow disease in cattle is caused by an organism which has:", ["Inert crystalline structure", "Abnormally folded protein", "Free RNA without protein coat", "Free DNA without protein coat"], 1, "It is caused by prions, abnormally folded proteins."], ["NEET 2020", "Which is correct about viroids?", ["They have DNA with protein coat", "They have free DNA without protein coat", "They have RNA with protein coat", "They have free RNA without protein coat"], 3, "Viroids are free RNA without a protein coat."], ["NEET 2022", "Statement I: Mycoplasma can pass through less than 1 micron filter size. Statement II: Mycoplasma are bacteria with a cell wall.", ["Both correct", "Both incorrect", "I correct, II incorrect", "I incorrect, II correct"], 2, "Mycoplasma are tiny and wall-less, so I is true and II is false."], ["NEET 2022", "Asexual reproductive structure associated with Penicillium:", ["Zoospores", "Conidia", "Gemmules", "Buds"], 1, "Penicillium reproduces asexually by conidia."], ["NEET 2024", "Match: A Rhizopus, B Ustilago, C Puccinia, D Agaricus with I Mushroom, II Smut fungus, III Bread mould, IV Rust fungus.", ["A-I, B-III, C-II, D-IV", "A-III, B-II, C-I, D-IV", "A-IV, B-III, C-II, D-I", "A-III, B-II, C-IV, D-I"], 1, "Rhizopus is bread mould, Ustilago is smut, Puccinia is rust, and Agaricus is a mushroom. Check the option wording against your paper."], ["NEET 2014", "Which is responsible for peat formation?", ["Marchantia", "Riccia", "Funaria", "Sphagnum"], 3, "Sphagnum moss forms peat, used as fuel."], ["NEET 2016", "Which statement is wrong?", ["Algae increase the level of dissolved oxygen in the immediate environment", "Algin is obtained from red algae, and carrageenan from brown algae", "Agar-agar is obtained from Gelidium and Gracilaria", "Laminaria and Sargassum are used as food"], 1, "Algin comes from brown algae and carrageen from red algae."], ["NEET 2016/2023", "Which is incorrectly matched?", ["Ectocarpus – Fucoxanthin", "Ulothrix – Mannitol", "Porphyra – Floridian Starch", "Volvox – Starch"], 1, "Ulothrix is a green alga storing starch. Mannitol is in brown algae."], ["NEET 2016", "Conifers tolerate extreme conditions because of", ["Broad hardy leaves", "Superficial stomata", "Thick cuticle", "Presence of vessels"], 2, "Needle leaves, sunken stomata and a thick cuticle reduce water loss."], ["NEET 2016-2020", "Select the correct statement:", ["Gymnosperms are both homosporous and heterosporous", "Salvinia, Ginkgo and Pinus all are gymnosperms", "Sequoia is one of the tallest trees", "The leaves of gymnosperms are not well adapted to extremes of climate"], 2, "Sequoia is among the tallest trees. Gymnosperms are all heterosporous and well adapted."], ["NEET 2016", "In bryophytes and pteridophytes, transport of male gametes requires:", ["Wind", "Insects", "Birds", "Water"], 3, "Their motile antherozoids swim to the egg through water."], ["NEET 2017", "An example of colonial alga is", ["Chlorella", "Volvox", "Ulothrix", "Spirogyra"], 1, "Volvox forms spherical colonies."], ["NEET 2017", "Select the mismatch:", ["Pinus – Dioecious", "Cycas – Dioecious", "Salvinia – Heterosporous", "Equisetum – Homosporous"], 0, "Pinus is monoecious. Cycas is dioecious."], ["NEET 2017-2023", "Which statement is correct?", ["Horsetails are gymnosperms", "Selaginella is heterosporous, while Salvinia is homosporous", "Ovules are not enclosed by ovary wall in gymnosperms", "Stems are usually unbranched in both Cycas and Cedrus"], 2, "Gymnosperm ovules are naked. Horsetails are pteridophytes, and both Selaginella and Salvinia are heterosporous."], ["NEET 2018", "Which one is wrongly matched?", ["Gemma cups – Marchantia", "Biflagellate zoospores – Brown algae", "Uniflagellate gametes – Polysiphonia", "Unicellular organism – Chlorella"], 2, "Polysiphonia (red alga) has no flagellated cells at all."], ["NEET 2019", "Retention of female gametophyte with developing embryo on the parent sporophyte is first observed in:", ["Liverworts", "Mosses", "Pteridophytes", "Gymnosperms"], 2, "In some pteridophytes (heterosporous ones) the female gametophyte is retained, a step towards the seed habit."], ["NEET 2020", "Strobili or cones are found in:", ["Marchantia", "Equisetum", "Salvinia", "Pteris"], 1, "Equisetum bears strobili (cones)."], ["NEET 2021", "Which algae produce Carrageen?", ["Red Algae", "Blue-Green Algae", "Green Algae", "Brown Algae"], 0, "Carrageen comes from red algae."], ["NEET 2021", "Which alga contains mannitol as reserve food?", ["Volvox", "Ulothrix", "Ectocarpus", "Gracilaria"], 2, "Brown algae store mannitol or laminarin."], ["NEET 2021", "Gemmae are present in:", ["Some Gymnosperms", "Some Liverworts", "Mosses", "Pteridophytes"], 1, "Liverworts like Marchantia make gemmae in gemma cups."], ["NEET 2021", "Genera like Selaginella and Salvinia produce two kinds of spores. Such plants are:", ["Homosporous", "Heterosporous", "Homosorus", "Heterosorus"], 1, "Two spore types (micro and mega) means heterosporous."], ["NEET 2022", "Hydrocolloid carrageen is obtained from", ["Chlorophyceae and Phaeophyceae", "Phaeophyceae and Rhodophyceae", "Rhodophyceae only", "Phaeophyceae only"], 2, "Carrageen is from Rhodophyceae (red algae) only."], ["NEET 2023", "Classes of algae with fucoxanthin and phycoerythrin, respectively:", ["Chlorophyceae and Rhodophyceae", "Rhodophyceae and Phaeophyceae", "Phaeophyceae and Chlorophyceae", "Phaeophyceae and Rhodophyceae"], 3, "Fucoxanthin: brown algae. Phycoerythrin: red algae."], ["NEET 2023", "A: In gymnosperms pollen grains are carried by air currents. R: Air currents carry pollen to the mouth of archegonia where gametes are discharged and no pollen tube is formed.", ["Both true, R explains A", "Both true, R does not explain A", "A true, R not true", "A not true, R true"], 2, "Gymnosperm pollen is wind borne, but a pollen tube is formed, so R is false."], ["NEET 2023", "A: First stage of the moss gametophyte is the protonema. R: Protonema develops directly from spores produced in capsule.", ["Both correct, R explains A", "Both correct, R does not explain A", "A correct, R not correct", "A not correct, R correct"], 0, "The spore germinates directly into the protonema, which is why R explains A."], ["NEET 2023", "Match: A Pteropsida, B Lycopsida, C Psilopsida, D Sphenopsida with I Psilotum, II Equisetum, III Adiantum, IV Selaginella.", ["A-II, B-III, C-IV, D-I", "A-III, B-IV, C-I, D-II", "A-II, B-III, C-I, D-IV", "A-III, B-I, C-IV, D-II"], 1, "Adiantum (ferns) = Pteropsida, Selaginella = Lycopsida, Psilotum = Psilopsida, Eq const $=id=>document.getElementById(id);
let Q,i,score,ans,locked,MODE,NAME="";const ML={all:"Full test",q20:"Quick 20",micro:"Microbes",plant:"Plants",anim:"Animals"};
/* music: soft pentatonic arpeggio over a drone, made with Web Audio */
let ac,mg,timer,on=false,step=0;
const N=[261.63,293.66,329.63,392,440,523.25,392,329.63,440,392,293.66,329.63];
function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function tick(){const t=ac.currentTime+.05;tone(N[step%N.length],t,.9,"triangle",.5);if(step%6===0)tone(N[step%N.length]/2,t,3.2,"sine",.5);step++}
function setMus(v){on=v;$("mus").textContent=v?"♪ Music on":"♪ Music off";$("mus").setAttribute("aria-pressed",v);
 if(v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();mg=mg||Object.assign(ac.createGain(),{});mg.gain.value=.12;mg.connect(ac.destination);ac.resume();clearInterval(timer);timer=setInterval(tick,520)}catch(e){on=false}}else{clearInterval(timer)}}
function sfx(ok){if(!ac||!on)return;const t=ac.currentTime;(ok?[523.25,659.25,783.99]:[220,165]).forEach((f,k)=>tone(f,t+k*.1,.35,ok?"sine":"sawtooth",ok?.9:.35))}
$("mus").onclick=()=>setMus(!on);
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(m){Q=m==="q20"?shuffle(D).slice(0,20):shuffle(D.filter((_,k)=>m==="all"||(m==="micro"?k>=3&&k<=30:m==="plant"?k>=31&&k<=59:(k<3||k>=60))));MODE=m;i=0;score=0;ans=[];["start","end"].forEach(s=>$(s).classList.add("hide"));$("quiz").classList.remove("hide");show()}
function show(){const d=Q[i];locked=false;$("cnt").textContent="Question "+(i+1)+" of "+Q.length;$("sc").textContent="Score "+score;$("pb").style.width=(i/Q.length*100)+"%";$("src").textContent=d[0];$("q").textContent=d[1];
 $("opts").innerHTML="";d[2].forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.innerHTML="<b>"+"ABCD"[k]+"</b><span></span>";b.lastChild.textContent=t;b.onclick=()=>pick(k);$("opts").appendChild(b)});
 $("exp").classList.add("hide");$("eb").classList.add("hide");$("nx").classList.add("hide");$("exp").textContent=d[4]}
function pick(k){if(locked)return;locked=true;const d=Q[i],ok=k===d[3];if(ok)score++;ans.push({q:d[1],ok,right:d[2][d[3]]});
 [...$("opts").children].forEach((b,j)=>{b.classList.add("off");if(j===d[3])b.classList.add("ok");else if(j===k)b.classList.add("no")});
 $("sc").textContent="Score "+score;sfx(ok);$("eb").classList.remove("hide");$("eb").textContent="Explanation";$("nx").classList.remove("hide");$("nx").textContent=i===Q.length-1?"See results":"Next question"}
$("eb").onclick=()=>{const h=$("exp").classList.toggle("hide");$("eb").textContent=h?"Explanation":"Hide explanation"};
$("nx").onclick=()=>{i++;if(i<Q.length)show();else finish()};
function finish(){$("quiz").classList.add("hide");$("end").classList.remove("hide");$("fs").textContent=score+" / "+Q.length;$("sv").textContent="Saving…";save();
 const p=score/Q.length;$("msg").textContent=p>=.85?"Excellent. You’re exam ready on this chapter.":p>=.6?"Good work. Revisit the questions you missed below.":"Keep going. Re-read the NCERT chapter and try again.";
 $("rev").innerHTML="";ans.forEach(a=>{const r=document.createElement("div");r.className="rv "+(a.ok?"ok":"no");r.textContent=(a.ok?"Correct: ":"Missed: ")+a.q+" Answer: "+a.right;$("rev").appendChild(r)})}
try{$("nm").value=localStorage.getItem("neetName")||""}catch(e){}
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{const n=$("nm").value.trim();if(!n){$("err").textContent="Enter your name to start.";$("nm").focus();return}$("err").textContent="";NAME=n;try{localStorage.setItem("neetName",n)}catch(e){}setMus(true);start(b.dataset.m)});
$("again").onclick=()=>{["end","quiz"].forEach(s=>$(s).classList.add("hide"));$("start").classList.remove("hide");loadLB()};
async function getDb(){try{return window.claude&&claude.use?await claude.use("db"):null}catch(e){return null}}
function localRecs(){try{return JSON.parse(localStorage.getItem("neetScores")||"[]")}catch(e){return[]}}
async function save(){const r={name:NAME,score,total:Q.length,mode:MODE,ts:Date.now()};let shared=false;
 try{const l=localRecs();l.push(r);localStorage.setItem("neetScores",JSON.stringify(l.slice(-50)))}catch(e){}
 try{const db=await getDb();if(db){await db.collection("scores").doc(r.ts+"-"+Math.random().toString(36).slice(2,7)).set(r);shared=true}}catch(e){}
 $("sv").textContent=shared?"Saved to the class leaderboard.":"Saved on this device only.";loadLB()}
async function loadLB(){let rs=[],src="this device";try{const db=await getDb();if(db){const s=await db.collection("scores").get();rs=s.docs.map(d=>d.data());src="everyone"}}catch(e){}
 if(!rs.length)rs=localRecs();rs.sort((a,b)=>b.score/b.total-a.score/a.total||b.total-a.total||b.ts-a.ts);
 const box=[$("lb"),$("lb2")];box.forEach(b=>{b.innerHTML=""});if(!rs.length){box.forEach(b=>b.textContent="No scores yet. Be the first.");return}
 rs.slice(0,10).forEach((r,k)=>box.forEach(b=>{const d=document.createElement("div");d.className="lb";const a=document.createElement("span"),c=document.createElement("span");a.textContent=(k+1)+". "+r.name+" ("+(ML[r.mode]||r.mode)+")";c.textContent=r.score+"/"+r.total+" · "+Math.round(r.score/r.total*100)+"%";d.append(a,c);b.appendChild(d)}))}
loadLB();
</script>
